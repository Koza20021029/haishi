<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海市・3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;900&family=Noto+Sans+TC:wght@400;500&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<style>
html, body { height: 100%; overflow: hidden; background: #05090c; color: var(--pearl); }
#stage { position: fixed; inset: 0; touch-action: none; }
body.free #stage { cursor: grab; }
#stage canvas { display: block; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
.hud { position: fixed; z-index: 5; }
.line { display: inline-block; width: 28px; height: 1px; background: var(--red); vertical-align: middle; margin-right: 10px; }

/* 左上 */
.brand { top: max(22px, env(safe-area-inset-top, 0px)); left: max(22px, env(safe-area-inset-left, 0px)); display: flex; gap: 16px; }
.brand b { font-family: var(--f-myth); font-weight: 900; font-size: 26px; line-height: 1.05; letter-spacing: .25em; writing-mode: vertical-rl; }
.brand nav { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; letter-spacing: .08em; padding-top: 2px; }
.brand a { text-decoration: none; opacity: .6; transition: opacity .3s; }
.brand a:hover { opacity: 1; }

/* 右上：導覽或自己逛 */
.mode { z-index: 9; top: max(22px, env(safe-area-inset-top, 0px)); right: max(22px, env(safe-area-inset-right, 0px)); display: flex; background: rgba(8,14,18,.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); gap: 2px; font-size: 13px; letter-spacing: .12em;
  border: 1px solid rgba(227,230,234,.18); border-radius: 30px; padding: 3px; }
.mode button { padding: 5px 14px; border-radius: 30px; opacity: .6; }
.mode button[aria-pressed="true"] { background: rgba(227,230,234,.12); opacity: 1; }

/* 左下：字幕 */
.caption { left: max(28px, env(safe-area-inset-left, 0px)); bottom: max(34px, env(safe-area-inset-bottom, 0px)); max-width: min(560px, calc(100vw - 56px));
  opacity: 0; transform: translateY(8px); transition: opacity .9s, transform .9s; pointer-events: none; }
.caption.on { opacity: 1; transform: none; }
.caption .n { font-family: var(--f-myth); font-size: 13px; letter-spacing: .3em; opacity: .75; margin-bottom: 14px; }
.caption .main { font-family: var(--f-myth); font-weight: 500; font-size: clamp(24px, 3.4vw, 40px); line-height: 1.35; letter-spacing: .08em; margin: 0 0 12px; text-wrap: balance; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
.caption .sub { font-family: var(--f-myth); font-weight: 300; font-size: 15.5px; line-height: 2; margin: 0; opacity: .82; max-width: 30em; text-shadow: 0 1px 12px rgba(0,0,0,.8); }
body.free .caption { opacity: 0 !important; }

/* 右下：章節與上下段 */
.steps { right: max(28px, env(safe-area-inset-right, 0px)); bottom: max(34px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 18px; }
#chList { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#chList button { font-family: var(--f-myth); font-size: 14px; letter-spacing: .2em; opacity: .38; transition: opacity .3s; display: flex; align-items: center; gap: 10px; }
#chList button span { font-size: 11px; opacity: .8; }
#chList button::after { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1px solid currentColor; }
#chList button[aria-current] { opacity: 1; }
#chList button[aria-current]::after { background: var(--red); border-color: var(--red); }
#chList button:hover { opacity: .85; }
.pn { display: flex; gap: 10px; }
.pn button { font-family: var(--f-myth); letter-spacing: .25em; font-size: 14px; padding: 10px 20px; border-radius: 40px; border: 1px solid rgba(227,230,234,.3); transition: background .3s; }
.pn #next { background: rgba(227,230,234,.92); color: #0a1015; border-color: transparent; }
.pn button:hover { background: rgba(227,230,234,.14); }
.pn #next:hover { background: #fff; }
.pn button:disabled { opacity: .25; cursor: default; }
body.free .steps { display: none; }

/* 自己逛：四個場域 */
.sites { left: 50%; transform: translateX(-50%); bottom: max(28px, env(safe-area-inset-bottom, 0px)); display: none; gap: 4px; padding: 4px;
  border-radius: 40px; background: rgba(8,14,18,.55); border: 1px solid rgba(227,230,234,.14); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
body.free .sites { display: flex; }
.sites button { font-family: var(--f-myth); font-size: 15px; letter-spacing: .2em; padding: 8px 18px; border-radius: 40px; white-space: nowrap; opacity: .8; }
.sites button:hover, .sites button[aria-pressed="true"] { background: rgba(227,230,234,.12); opacity: 1; }
.sites button.main { color: #fff; background: rgba(184,52,42,.85); opacity: 1; }

/* 右側欄 */
.panel { top: 0; right: 0; bottom: 0; width: min(410px, 100vw); background: linear-gradient(180deg, rgba(10,16,21,.92), rgba(7,12,16,.96)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-left: 1px solid rgba(227,230,234,.08); overflow-y: auto; padding: calc(max(22px, env(safe-area-inset-top, 0px)) + 52px) max(26px, env(safe-area-inset-right, 0px)) 80px 28px;
  transform: translateX(104%); transition: transform .7s cubic-bezier(.2,.8,.2,1); z-index: 8; }
.panel.open { transform: none; }
.panel .close { position: absolute; top: max(30px, env(safe-area-inset-top, 0px)); left: 28px; font-size: 12px; letter-spacing: .2em; opacity: .6; }
.panel .close:hover { opacity: 1; }
.p-head { display: flex; align-items: flex-end; gap: 16px; margin: 26px 0 22px; padding-bottom: 18px; border-bottom: 1px solid rgba(227,230,234,.1); }
.p-head h2 { font-family: var(--f-myth); font-weight: 900; font-size: 46px; letter-spacing: .14em; margin: 0; line-height: 1; }
.p-meta { font-size: 12px; line-height: 1.7; opacity: .55; letter-spacing: .05em; }
.p-call { font-family: var(--f-hand); font-size: 21px; line-height: 1.6; margin: 0 0 18px; color: #f4e7d6; }
.p-text { font-family: var(--f-myth); font-weight: 300; font-size: 15px; line-height: 2; margin: 0 0 12px; color: #d3dade; }
.p-echo { font-family: var(--f-myth); font-weight: 300; font-size: 14px; line-height: 1.9; margin: 0 0 18px; color: #9fb0b6; padding-left: 14px; border-left: 1px solid var(--red); }
.panel h3 { font-family: var(--f-myth); font-weight: 500; font-size: 14px; letter-spacing: .3em; margin: 30px 0 12px; opacity: .7; }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 14px; }
.photos img, .photos canvas { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
.weights { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.weights div { background: #b8342a; color: #fff; font-family: var(--f-hand); text-align: center; padding: 6px 2px 4px; font-size: 20px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.weights small { display: block; font-size: 12px; opacity: .85; }
.preview { display: grid; gap: 6px; margin-top: 12px; font-size: 12.5px; opacity: .85; }
.preview input { width: 100%; accent-color: #b8342a; }
.preview-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.preview-row button { font-size: 12px; border: 1px solid rgba(227,230,234,.25); border-radius: 20px; padding: 2px 10px; }
form { display: grid; gap: 12px; }
label { display: grid; gap: 6px; font-size: 12.5px; letter-spacing: .05em; color: #a9b7bc; }
input[type="text"], textarea { font: inherit; font-family: var(--f-hand); font-size: 18px; color: var(--pearl); background: rgba(227,230,234,.04); border: 0; border-bottom: 1px solid rgba(227,230,234,.25); border-radius: 0; padding: 8px 2px; width: 100%; }
input[type="text"]:focus, textarea:focus { outline: none; border-bottom-color: var(--pearl); }
textarea { min-height: 70px; resize: vertical; }
.weigh { justify-self: start; margin-top: 6px; font-family: var(--f-myth); letter-spacing: .3em; padding: 10px 24px; border-radius: 40px; background: rgba(227,230,234,.92); color: #0a1015; }

/* 序 */
.intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 55%, rgba(5,9,12,.25), rgba(5,9,12,.92) 75%); transition: opacity 1.6s; }
.intro.gone { opacity: 0; pointer-events: none; }
.intro-in { display: grid; grid-template-columns: auto minmax(0, 420px); gap: 56px; align-items: center; }
.intro .q { font-family: var(--f-myth); font-weight: 500; font-size: clamp(30px, 4.6vw, 52px); letter-spacing: .4em; writing-mode: vertical-rl; line-height: 1; }
.intro .q small { font-size: .28em; letter-spacing: .4em; opacity: .55; margin-top: 1.4em; }
.intro p { font-family: var(--f-myth); font-weight: 300; font-size: 16px; line-height: 2.1; margin: 0 0 30px; opacity: .85; }
.intro .go { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
#begin { font-family: var(--f-myth); letter-spacing: .4em; padding: 12px 34px 12px 38px; border-radius: 40px; background: rgba(227,230,234,.92); color: #0a1015; }
#begin:disabled { opacity: .4; cursor: progress; }
#skip { font-size: 13px; letter-spacing: .15em; opacity: .6; text-decoration: underline; text-underline-offset: 4px; }

.toast { position: fixed; z-index: 9; left: 50%; top: 16%; transform: translateX(-50%); width: max-content; max-width: min(460px, 88vw); text-align: center;
  font-family: var(--f-myth); font-weight: 300; font-size: 17px; line-height: 1.9; text-shadow: 0 0 20px rgba(0,0,0,.9); opacity: 0; transition: opacity 1s; pointer-events: none; }
.toast b { display: block; font-family: var(--f-hand); font-weight: 400; font-size: 26px; }
.toast.on { opacity: 1; }
/* 叫賣的對話框 */
.callout { position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; font-family: var(--f-hand); font-size: 19px; line-height: 1.5; color: #1d2a30; background: #f3efe4; padding: 8px 16px 9px; border-left: 3px solid var(--red);
  box-shadow: 0 10px 30px rgba(0,0,0,.45); max-width: 18em; opacity: 0; transition: opacity .6s; white-space: normal; }
.callout::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -6px; border: 6px solid transparent; border-top-color: #f3efe4; border-bottom: 0; border-top-width: 9px; }
.callout.on { opacity: 1; }
.voice { z-index: 9; top: calc(max(22px, env(safe-area-inset-top, 0px)) + 44px); right: max(22px, env(safe-area-inset-right, 0px)); font-size: 12.5px; letter-spacing: .12em; padding: 5px 14px; border-radius: 30px;
  border: 1px solid rgba(227,230,234,.18); background: rgba(8,14,18,.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: .75; }
@media (min-width: 761px) { body.panel-open .mode, body.panel-open .voice { right: calc(min(410px, 100vw) + 22px); } }
@media (min-width: 761px) { body.panel-open .toast { left: calc((100vw - min(410px, 100vw)) / 2); max-width: min(420px, calc(100vw - 470px)); } }
@media (max-width: 760px) { body.panel-open .mode, body.panel-open .voice, body.panel-open .toast { opacity: 0; pointer-events: none; } }
.mode, .voice { transition: right .7s cubic-bezier(.2,.8,.2,1), opacity .4s; }
.voice::before { content: "♪ "; }
.voice[aria-pressed="true"] { opacity: 1; background: rgba(184,52,42,.85); border-color: transparent; }

/* 攤上買賣 */
.p-look { font-family: var(--f-myth); font-weight: 300; font-size: 14px; line-height: 1.95; margin: 0 0 6px; color: #b9c5c9; }
.tsteps { list-style: none; padding: 0; margin: 0 0 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; counter-reset: s; }
.tsteps li { counter-increment: s; font-size: 12.5px; letter-spacing: .12em; padding: 8px 0 0; border-top: 2px solid rgba(227,230,234,.15); opacity: .5; }
.tsteps li::before { content: counter(s, cjk-ideographic) "　"; opacity: .8; }
.tsteps li.done { opacity: .75; border-top-color: rgba(227,230,234,.5); }
.tsteps li[aria-current] { opacity: 1; border-top-color: var(--red); }
.vendor { font-family: var(--f-hand); font-size: 19px; line-height: 1.6; color: #f4e7d6; margin: 0 0 14px; }
.hint { font-size: 12.5px; opacity: .6; margin: 10px 0 0; line-height: 1.7; }
.icecards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.icecard { display: grid; gap: 4px; text-align: center; padding: 0 0 8px; background: rgba(227,230,234,.04); border: 1px solid rgba(227,230,234,.12); transition: border-color .3s, transform .3s; }
.icecard:hover, .icecard:focus-visible { border-color: rgba(227,230,234,.6); transform: translateY(-2px); }
.icecard canvas { width: 100%; aspect-ratio: 3/4; display: block; filter: saturate(.9) brightness(1.1); }
.icecard b { font-family: var(--f-myth); font-weight: 500; font-size: 14px; letter-spacing: .1em; }
.icecard .kg { font-family: var(--f-hand); font-size: 13px; color: #fff; background: var(--red); justify-self: center; padding: 0 8px; }
.chosen { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; margin-bottom: 8px; }
.chosen canvas { width: 48px; height: 64px; display: block; }
.chosen b { display: block; font-family: var(--f-myth); font-weight: 500; font-size: 16px; letter-spacing: .06em; }
.chosen span { font-family: var(--f-hand); font-size: 15px; color: #f4c9bf; }
.link { font-size: 12px; letter-spacing: .1em; opacity: .7; text-decoration: underline; text-underline-offset: 4px; }
.scale { width: 150px; margin: 6px auto 4px; }
.scale svg { width: 100%; display: block; overflow: visible; }
.scale .face { fill: #f2f1ea; stroke: #8c969a; stroke-width: 2; }
.scale .ticks line { stroke: #2a3236; stroke-width: 1.2; }
.scale .mark { fill: var(--red); }
.scale .unit { font: 700 11px var(--f-myth); fill: var(--red); text-anchor: middle; }
.scale .nd { transform-origin: 60px 66px; transform: rotate(-120deg); transition: transform .8s cubic-bezier(.3,1.6,.5,1); }
.scale .nd line { stroke: var(--red); stroke-width: 2.4; stroke-linecap: round; }
.scale .hub { fill: #2a3236; }
.scale.ok .face { stroke: var(--red); }
.readout { text-align: center; font-family: var(--f-hand); font-size: 22px; margin: 4px 0 14px; font-variant-numeric: tabular-nums; }
.readout small { font-family: var(--f-body); font-size: 11px; opacity: .6; margin-left: 4px; letter-spacing: .1em; }
.readout .vs { opacity: .4; margin: 0 10px; }
.weigh:disabled { opacity: .3; cursor: not-allowed; }
.receipt { position: relative; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.receipt img { width: 100%; display: block; }
.receipt .melt { position: absolute; inset: 0; opacity: 0; transition: opacity 40s linear; }
.receipt .melt.on { opacity: 1; }
.swap { font-family: var(--f-myth); font-weight: 300; font-size: 14px; line-height: 1.9; margin: 16px 0 0; padding: 12px 14px; background: #f4f2ea; color: #2a3236; transform: rotate(-.6deg); }
.swap small { display: block; font-size: 11.5px; letter-spacing: .12em; color: #7d878b; }
.swap b { display: block; font-family: var(--f-hand); font-weight: 400; font-size: 22px; }
.acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.acts a.weigh { text-decoration: none; margin: 0; }
.acts button { font-size: 13px; letter-spacing: .12em; padding: 9px 16px; border-radius: 40px; border: 1px solid rgba(227,230,234,.3); }
.icetime { margin-top: 28px; border-top: 1px solid rgba(227,230,234,.1); padding-top: 14px; }
.icetime summary { cursor: pointer; font-family: var(--f-myth); font-size: 14px; letter-spacing: .3em; opacity: .7; margin-bottom: 12px; }
#nogl { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--sea); }

@media (max-width: 720px) {
  .intro-in { grid-template-columns: 1fr; gap: 28px; }
  .intro .q { writing-mode: horizontal-tb; letter-spacing: .2em; }
  .intro .q small { display: block; margin-top: .8em; }
  .caption { bottom: calc(max(24px, env(safe-area-inset-bottom, 0px)) + 64px); left: 20px; right: 20px; max-width: none; }
  .caption .sub { font-size: 14px; }
  .steps { right: 50%; transform: translateX(50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); }
  #chList { display: none; }
  .sites button { padding: 8px 11px; font-size: 14px; letter-spacing: .1em; }
  .brand nav { display: none; }
}
</style>
</head>
<body>
<div id="stage" aria-label="海市 3D 場景"></div>

<section class="intro" id="intro" aria-label="序">
  <div class="intro-in">
    <div class="q">海旁蜃氣象樓臺<small>史記・天官書</small></div>
    <div>
      <p>這是一座從龍口市場吐出來的海市。接下來會帶你走五小段，從一則古老的說法開始，最後回到市場，在攤上做一筆買賣，用你的一個地方換一袋融水。</p>
      <div class="go"><button type="button" id="begin" disabled>海市正在成形</button><button type="button" id="skip">直接自己逛</button></div>
    </div>
  </div>
</section>

<div id="ui" hidden>
  <div class="hud brand"><b>海市</b><nav aria-label="離開"><a href="index.html">回到地平線</a><a href="market.html">走進市場</a></nav></div>
  <div class="hud mode" role="group" aria-label="觀看方式"><button type="button" id="tourBtn" aria-pressed="true">導覽</button><button type="button" id="freeBtn" aria-pressed="false">自己逛</button></div>
  <div class="hud caption" id="caption" aria-live="polite"><div class="n"><span class="line"></span><span id="capN"></span></div><p class="main" id="capMain"></p><p class="sub" id="capSub"></p></div>
  <div class="hud steps"><nav id="chList" aria-label="章節"></nav><div class="pn"><button type="button" id="prev">上一段</button><button type="button" id="next">下一段</button></div></div>
  <nav class="hud sites" id="siteNav" aria-label="四個場域"></nav>
  <button type="button" class="hud voice" id="voiceBtn" aria-pressed="false">叫賣聲</button>
</div>
<div class="callout" id="callout" aria-hidden="true"></div>

<aside class="hud panel" id="panel" aria-label="場域"><button type="button" class="close" id="closePanel">收起</button><div id="panelBody"></div></aside>
<div class="toast" id="toast" role="status"></div>
<div id="nogl" hidden><p>這台裝置沒辦法顯示 3D 畫面。<br><a href="market.html">改走進市場</a></p></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
</body>
</html>
